<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Medinson ERP — промо-ролик</title>
<style>
  @font-face{font-family:"IBM Plex Sans";font-weight:400;src:url(fonts/IBMPlexSans-400.ttf)}
  @font-face{font-family:"IBM Plex Sans";font-weight:500;src:url(fonts/IBMPlexSans-500.ttf)}
  @font-face{font-family:"IBM Plex Sans";font-weight:600;src:url(fonts/IBMPlexSans-600.ttf)}
  @font-face{font-family:"IBM Plex Sans";font-weight:700;src:url(fonts/IBMPlexSans-700.ttf)}
  :root{ --blue:#1F76FB; --navy:#072267; --sky:#D7E7FF; --mint:#95EACE; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:720px;height:1280px;overflow:hidden;background:#fff}
  body{font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--navy);position:relative;-webkit-font-smoothing:antialiased}
  #stage{position:absolute;inset:0;overflow:hidden;background:#fff}
  .blob{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform;pointer-events:none}
  #b1{left:-220px;top:700px;width:640px;height:640px;background:radial-gradient(circle,rgba(215,231,255,.9),rgba(215,231,255,0) 65%)}
  #b2{left:330px;top:820px;width:640px;height:640px;background:radial-gradient(circle,rgba(149,234,206,.45),rgba(149,234,206,0) 65%)}

  .logo{position:absolute;left:46px;top:116px;height:38px}
  .logo img{height:38px;display:block}

  .steps{position:absolute;left:46px;top:186px;display:flex;gap:6px;opacity:0}
  .steps i{display:block;width:52px;height:5px;border-radius:3px;background:#e4ebf7}
  .steps i.on{background:var(--blue)}
  .headline{position:absolute;left:46px;top:206px;width:640px;font-size:50px;line-height:1.12;font-weight:600;letter-spacing:-1px;color:var(--navy)}
  .headline .w{display:inline-block;white-space:pre;will-change:transform,filter,opacity}
  .headline .b{color:var(--blue)}
  .pill{position:absolute;left:46px;top:352px;background:var(--blue);color:#fff;font-weight:600;font-size:19px;padding:13px 24px;border-radius:100px;box-shadow:0 12px 30px rgba(31,118,251,.32);opacity:0;white-space:nowrap}

  .world{position:absolute;left:0;top:0;width:720px;height:1280px;perspective:1500px;perspective-origin:50% 56%}

  /* ---- iPhone Pro Max ---- */
  .phone{position:absolute;left:190px;top:398px;width:340px;height:715px;transform-style:preserve-3d;will-change:transform}
  .phone .frame{position:absolute;inset:0;border-radius:50px;
    background:linear-gradient(150deg,#f2f3f6 0%,#b4b7bf 18%,#6f737b 45%,#4a4d54 70%,#a3a6ad 100%);
    box-shadow:0 60px 110px rgba(7,34,103,.28),0 20px 40px rgba(7,34,103,.14),inset 0 0 0 1px rgba(255,255,255,.5)}
  .phone .frame:after{content:"";position:absolute;inset:3px;border-radius:47px;background:#0a0b0e;box-shadow:inset 0 0 0 1px #2a2c31}
  .phone .side{position:absolute;left:0;top:0;width:340px;height:715px;border-radius:50px;background:#54575e;transform:translateZ(-14px)}
  .phone .btn{position:absolute;background:linear-gradient(90deg,#c3c6cd,#7a7e86);border-radius:2px}
  .phone .b1{left:-3px;top:120px;width:3px;height:30px}
  .phone .b2{left:-3px;top:172px;width:3px;height:58px}
  .phone .b3{left:-3px;top:244px;width:3px;height:58px}
  .phone .b4{right:-3px;top:206px;width:3px;height:90px}
  .phone .screen{position:absolute;left:9px;top:9px;right:9px;bottom:9px;border-radius:41px;background:#fafbfa;overflow:hidden;transform:translateZ(1px)}
  .phone .glare{position:absolute;inset:0;border-radius:41px;background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.04) 28%,rgba(255,255,255,0) 42%);pointer-events:none;z-index:9}
  .phone .island{position:absolute;left:50%;top:19px;width:94px;height:27px;margin-left:-47px;border-radius:14px;background:#000;transform:translateZ(2px);z-index:10}
  .phone .island:after{content:"";position:absolute;right:7px;top:7px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 45% 45%,#15171c,#000 70%)}
  .status{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 34px 0 38px;font-size:15px;font-weight:600;color:#000;z-index:5;letter-spacing:-.2px}
  .status .ic{display:flex;gap:6px;align-items:center}
  .status .bars{display:flex;gap:2px;align-items:flex-end}
  .status .bars i{display:block;width:3px;background:#000;border-radius:1px}
  .status .bat{width:25px;height:12px;border:1.5px solid rgba(0,0,0,.7);border-radius:4px;position:relative}
  .status .bat:after{content:"";position:absolute;left:2px;top:2px;right:2px;bottom:2px;background:#000;border-radius:1.5px}
  .shots{position:absolute;left:0;right:0;top:44px;height:574px;overflow:hidden}
  .shots img{position:absolute;left:0;top:0;width:322px;height:auto;display:block;opacity:0}
  .safari{position:absolute;left:0;right:0;bottom:0;height:79px;background:#fff;z-index:4}
  .safari .url{position:absolute;left:50%;top:13px;width:240px;height:40px;margin-left:-120px;border-radius:20px;background:#3c3c3f;color:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center}
  .safari .home{position:absolute;left:50%;bottom:7px;width:124px;height:5px;margin-left:-62px;border-radius:3px;background:#111}

  /* ---- brand floating assets ---- */
  .fa{position:absolute;left:0;top:0;will-change:transform;opacity:0;transform-origin:center}
  .fa img{display:block;filter:drop-shadow(0 26px 36px rgba(7,34,103,.22))}
  .fa.kpi img{width:250px}
  .fa.icon img{width:170px}
  .fa.gear img{width:150px}
</style>
</head>
<body>
<div id="stage">
  <div class="blob" id="b1"></div><div class="blob" id="b2"></div>
  <div class="logo"><img src="brand/logo_blue.png" alt="medinson"></div>
  <div class="steps" id="steps"><i></i><i></i><i></i></div>
  <div class="headline" id="headline"></div>
  <div class="pill" id="pill"></div>

  <div class="world">
    <div class="fa gear" id="g1"><img src="brand/gear_blue.png"></div>
    <div class="fa gear" id="g2"><img src="brand/gear_violet.png"></div>
    <div class="fa gear" id="g3"><img src="brand/gear_teal.png"></div>

    <div class="phone" id="phone2" style="opacity:0">
      <div class="side"></div><div class="frame"></div>
      <div class="btn b1"></div><div class="btn b2"></div><div class="btn b3"></div><div class="btn b4"></div>
      <div class="screen">
        <div class="status"><span>9:41</span><div class="ic"><div class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></div><div class="bat"></div></div></div>
        <div class="shots"><img src="shots/s3.jpg" style="opacity:1"></div>
        <div class="safari"><div class="url">medinson.biznesapp.uz</div><div class="home"></div></div>
        <div class="glare"></div>
      </div>
      <div class="island"></div>
    </div>

    <div class="phone" id="phone">
      <div class="side"></div><div class="frame"></div>
      <div class="btn b1"></div><div class="btn b2"></div><div class="btn b3"></div><div class="btn b4"></div>
      <div class="screen">
        <div class="status"><span>9:41</span><div class="ic"><div class="bars"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:10px"></i></div><div class="bat"></div></div></div>
        <div class="shots" id="shots">
          <img id="sh21" src="shots/s21.jpg"><img id="sh18" src="shots/s18.jpg"><img id="sh19" src="shots/s19.jpg">
          <img id="sh4"  src="shots/s4.jpg"><img id="sh13" src="shots/s13.jpg"><img id="sh10" src="shots/s10.jpg">
          <img id="sh9"  src="shots/s9.jpg"><img id="sh5"  src="shots/s5.jpg"><img id="sh7"  src="shots/s7.jpg">
          <img id="sh16" src="shots/s16.jpg"><img id="sh11" src="shots/s11.jpg">
        </div>
        <div class="safari"><div class="url">medinson.biznesapp.uz</div><div class="home"></div></div>
        <div class="glare"></div>
      </div>
      <div class="island"></div>
    </div>

    <div class="fa kpi" id="k1"><img src="brand/kpi_income.png"></div>
    <div class="fa kpi" id="k2"><img src="brand/kpi_patients.png"></div>
    <div class="fa kpi" id="k3"><img src="brand/kpi_new.png"></div>
    <div class="fa kpi" id="k4"><img src="brand/kpi_debt.png"></div>
    <div class="fa icon" id="i1"><img src="brand/icon_hourglass.png"></div>
    <div class="fa icon" id="i2"><img src="brand/icon_gear.png"></div>
    <div class="fa icon" id="i3"><img src="brand/icon_phone.png"></div>
  </div>
</div>

<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const easeOut=x=>1-Math.pow(1-x,3);
const easeInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const smooth=x=>x*x*(3-2*x);
const lerp=(a,b,p)=>a+(b-a)*p;
function kf(t,pts,ease=easeInOut){
  if(t<=pts[0][0])return pts[0][1];
  for(let i=1;i<pts.length;i++){if(t<=pts[i][0]){const [t0,v0]=pts[i-1],[t1,v1]=pts[i];return lerp(v0,v1,ease(clamp((t-t0)/(t1-t0))));}}
  return pts[pts.length-1][1];
}
const LANG=new URLSearchParams(location.search).get('lang')||'ru';
const TXT={
  ru:[['Каждый показатель','под *контролем*'],['Как это *работает?*'],['Управляйте *бронями*'],['*Финансы* в реальном','времени'],['*Персонал* и склад —','в одном окне'],['Вся статистика —','на *одном* экране'],['Загрузка коек —','*каждый* день'],['Клиника работает, даже','когда вас *нет* *внутри*']],
  uz:[['Har bir ko‘rsatkich','*nazorat* ostida'],['Bu *qanday* ishlaydi?'],['*Bronlarni* boshqaring'],['*Moliya* — real vaqtda'],['*Xodimlar* va ombor —','bitta oynada'],['Barcha statistika —','*bitta* ekranda'],['Koyka bandligi —','*har* *kuni*'],['Klinika siz yo‘q paytda','ham *ishlaydi*']],
};
const PILL={ru:'Свяжитесь с менеджером Medinson',uz:'Medinson menejeri bilan bog‘laning'};
const T=TXT[LANG]||TXT.ru;
const SCENES=[
  {s:0,   e:7,   lines:T[0]},
  {s:7,   e:9.5, lines:T[1]},
  {s:9.5, e:12,  lines:T[2], step:1},
  {s:12,  e:14.5,lines:T[3], step:2},
  {s:14.5,e:17,  lines:T[4], step:3},
  {s:17,  e:23,  lines:T[5]},
  {s:23,  e:28.5,lines:T[6]},
  {s:28.5,e:35.5,lines:T[7], pill:PILL[LANG]||PILL.ru},
];
// one continuous timeline of screenshots: [time, id]; each new one cross-fades over 0.45s
const SHOTS=[[0,'sh21'],[7,'sh18'],[9.5,'sh19'],[12,'sh4'],[13.3,'sh13'],[14.5,'sh10'],[15.8,'sh9'],[17,'sh5'],[19.8,'sh7'],[23,'sh16'],[28.5,'sh11']];
// continuous phone motion (no jumps at scene boundaries)
const PH={
  x:[[0,0],[17,0],[19,-40],[23,0],[24,120],[28.5,120],[29.4,0]],
  y:[[0,250],[1.1,-10],[23,-10],[24,40],[28.5,40],[29.4,22],[35.5,16]],
  ry:[[0,-18],[3,-6],[6.5,-14],[7.5,-14],[9.5,8],[12,0],[14.5,-8],[17,-4],[19,26],[21.5,10],[23,2],[24,-14],[28.5,-10],[31,6],[35.5,-4]],
  rx:[[0,6],[3.5,3],[7,5],[9,4],[12,3],[17,3],[19,8],[23,4],[28.5,4],[35.5,2]],
  rz:[[0,-6],[3,-2],[7,-5],[9,-2],[12,0],[14.5,-2],[17,-1],[19,-6],[23,0],[24,-3],[28.5,-3],[31,0],[35.5,-2]],
  s:[[0,0.92],[1.1,1],[23,1],[24,0.9],[28.5,0.9],[29.4,1]],
};
function sceneAt(t){return SCENES.find(s=>t>=s.s&&t<s.e)||SCENES[SCENES.length-1];}
const headline=document.getElementById('headline'); let builtFor=null;
function buildHeadline(sc){
  headline.innerHTML='';
  sc.lines.forEach((ln,li)=>{
    ln.split(' ').forEach((w,wi,arr)=>{const sp=document.createElement('span');sp.className='w';let txt=w;
      if(w.startsWith('*')){sp.classList.add('b');txt=w.replace(/\*/g,'');}
      sp.textContent=txt+(wi<arr.length-1?' ':'');headline.appendChild(sp);});
    if(li<sc.lines.length-1)headline.appendChild(document.createElement('br'));
  });
  builtFor=sc;
}
function animHeadline(sc,t){
  if(builtFor!==sc)buildHeadline(sc);
  const lt=t-sc.s,out=sc.e-t;
  headline.querySelectorAll('.w').forEach((w,i)=>{const d=i*0.07,p=easeOut(clamp((lt-d)/0.45)),q=1-easeInOut(clamp((0.35-out)/0.35));
    w.style.opacity=(p*q).toFixed(3);w.style.transform=`translateY(${(1-p)*14}px)`;w.style.filter=`blur(${(1-p)*8}px)`;});
}
const steps=document.getElementById('steps'),pill=document.getElementById('pill');
const phone=document.getElementById('phone'),phone2=document.getElementById('phone2');
const shotEls=[...document.querySelectorAll('#shots img')];
function showShots(t){
  let cur=0; for(let i=0;i<SHOTS.length;i++) if(t>=SHOTS[i][0]) cur=i;
  const p=cur===0?1:smooth(clamp((t-SHOTS[cur][0])/0.45));
  const op={}; op[SHOTS[cur][1]]=p; if(cur>0) op[SHOTS[cur-1][1]]=1-p;
  shotEls.forEach(el=>el.style.opacity=op[el.id]||0);
}
const FA=['g1','g2','g3','k1','k2','k3','k4','i1','i2','i3'];
function fa(id,{x=0,y=0,z=0,rx=0,ry=0,rz=0,s=1,o=1}){const el=document.getElementById(id);el.style.opacity=o;
  el.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;}
function setPhone(el,{x=0,y=0,rx=0,ry=0,rz=0,s=1,o=1}){el.style.opacity=o;el.style.transform=`translate3d(${x}px,${y}px,0) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})`;}
// gentle card: eases in from a small offset over 0.6s, drifts out over 0.5s before `tOut`
function card(id,lt,tIn,tOut,x,y,extra={}){
  const p=easeOut(clamp((lt-tIn)/0.6)), q=1-easeInOut(clamp((lt-(tOut-0.5))/0.5));
  const side=x<360?-1:1, bob=Math.sin(lt*1.1+x*0.01)*5;
  fa(id,Object.assign({x:x+side*(1-p)*36,y:y+(1-p)*22-(1-q)*16+bob,o:p*q,s:0.94+0.06*p},extra));
}

window.seek=function(t){
  const sc=sceneAt(t),lt=t-sc.s,dur=sc.e-sc.s,idx=SCENES.indexOf(sc);
  animHeadline(sc,t);
  if(sc.step){steps.style.opacity=easeOut(clamp(lt/0.4))*(1-easeInOut(clamp((lt-(dur-0.35))/0.35)));[...steps.children].forEach((i,k)=>i.classList.toggle('on',k<sc.step));}else steps.style.opacity=0;
  if(sc.pill){pill.textContent=sc.pill;const p=easeOut(clamp((lt-0.9)/0.6));pill.style.opacity=p;pill.style.transform=`translateY(${(1-p)*16}px)`;}else pill.style.opacity=0;
  FA.forEach(id=>document.getElementById(id).style.opacity=0);
  showShots(t);
  setPhone(phone,{x:kf(t,PH.x),y:kf(t,PH.y,easeOut),rx:kf(t,PH.rx),ry:kf(t,PH.ry),rz:kf(t,PH.rz),s:kf(t,PH.s,easeOut)});
  document.getElementById('b1').style.transform=`translate(${Math.sin(t*0.25)*40}px,${Math.cos(t*0.2)*30}px)`;
  document.getElementById('b2').style.transform=`translate(${Math.cos(t*0.22)*50}px,${Math.sin(t*0.18)*30}px)`;
  phone2.style.opacity=0;

  switch(idx){
    case 0:
      card('k1',lt,1.5,dur,-20,720,{z:140,ry:16,rz:-3});
      card('k2',lt,2.2,dur,470,470,{z:120,ry:-18,rz:3});
      card('k3',lt,2.9,dur,455,930,{z:160,ry:-16,rz:-2});
      card('i2',lt,3.6,dur,30,420,{z:60,ry:14,rz:-6,s:0.85});
      break;
    case 1:{
      const g=(id,x,y,dir,st)=>{const p=easeOut(clamp((lt-st)/0.6)),q=1-easeInOut(clamp((lt-(dur-0.5))/0.5));fa(id,{x,y:y+Math.sin(lt*1.1+x*0.01)*5,z:-60,rz:dir*t*40,s:0.85+0.15*p,o:p*q});};
      g('g1',40,450,1,0.2); g('g2',520,560,-1,0.35); g('g3',470,920,1,0.5);
      break;}
    case 2: card('k3',lt,0.5,dur,452,540,{z:150,ry:-16,rz:3}); break;
    case 3:
      card('k1',lt,0.5,dur,-10,560,{z:150,ry:16,rz:-3});
      card('k4',lt,1.4,dur,455,900,{z:150,ry:-16,rz:2});
      break;
    case 4:
      card('k2',lt,0.5,dur,458,500,{z:150,ry:-16,rz:3});
      card('i1',lt,1.3,dur,20,860,{z:80,ry:12,rz:-5,s:0.8});
      break;
    case 5:
      card('k3',lt,0.6,dur,456,470,{z:200,ry:-20,rz:5,rx:3});
      card('k2',lt,2.4,dur,-15,880,{z:170,ry:16,rz:-3});
      card('k1',lt,3.6,dur,468,960,{z:150,ry:-14,rz:2});
      break;
    case 6:{
      const lp=easeOut(clamp((lt-0.5)/0.9)),q=1-easeInOut(clamp((lt-(dur-0.5))/0.5));
      setPhone(phone2,{x:lerp(-260,-165,lp),y:-20+Math.sin(t*0.9)*4,ry:18,rx:4,rz:-2,s:0.8,o:lp*q});
      card('i1',lt,1.6,dur,470,960,{z:120,ry:-14,rz:4,s:0.85});
      break;}
    case 7:
      card('i3',lt,1.4,dur,495,520,{z:140,ry:-16,rz:6,s:0.9});
      card('k1',lt,2.2,dur,-15,900,{z:150,ry:16,rz:-3});
      break;
  }
  document.getElementById('stage').style.opacity=1-clamp((t-34.9)/0.6);
};
window.seek(0);
if(location.search.includes('play')){const t0=performance.now();(function loop(){window.seek(((performance.now()-t0)/1000)%35.5);requestAnimationFrame(loop);})();}
</script>
</body>
</html>
